const FACE_T=0.5,MURL='https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.12/model';let FA={ready:false,stream:null};
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const camSt=m=>{const e=$('camst');if(e)e.textContent=m},geoSt=m=>{const e=$('gst');if(e)e.textContent=m};
function camOff(){if(FA.stream){FA.stream.getTracks().forEach(t=>t.stop());FA.stream=null}const v=$('cam');if(v)v.srcObject=null;const f=$('fbox');if(f){f.style.borderStyle='dashed';f.style.borderColor='#FFD21F';f.style.boxShadow='none'}}
async function faceLoad(){if(FA.ready)return;if(!window.faceapi)throw new Error('Library wajah gagal dimuat, cek koneksi internet');await Promise.all([faceapi.nets.tinyFaceDetector.loadFromUri(MURL),faceapi.nets.faceLandmark68Net.loadFromUri(MURL),faceapi.nets.faceRecognitionNet.loadFromUri(MURL)]);FA.ready=true}
async function camOn(){if(!navigator.mediaDevices)throw new Error('Kamera butuh koneksi HTTPS');if(!FA.stream)FA.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user',width:{ideal:640},height:{ideal:640}},audio:false}).catch(()=>{throw new Error('Izin kamera ditolak. Aktifkan kamera untuk situs ini.')});const v=$('cam');v.srcObject=FA.stream;await v.play();let k=0;while((v.readyState<2||!v.videoWidth)&&k++<60)await sleep(100);guide(false,'Arahkan wajah ke dalam kotak')}
function guide(ok,m){const f=$('fbox'),c=ok?'#5EE17B':'#FF5C89';if(f){f.style.display='block';f.style.borderStyle=ok?'solid':'dashed';f.style.borderColor=c;f.style.boxShadow='0 0 26px '+c}camSt((ok?'🟢 ':'🔴 ')+m)}
async function faceGrab(maxMs=25000){const v=$('cam');if(!v)return null;const o=new faceapi.TinyFaceDetectorOptions({inputSize:320,scoreThreshold:.4});let okN=0,miss=0;const t0=Date.now();
 while(Date.now()-t0<maxMs){if(!$('cam')||!FA.stream)return null;
  const d=await faceapi.detectSingleFace(v,o);
  if(!d){okN=0;miss++;guide(false,miss>8?'Wajah belum terlihat • cari tempat lebih terang':'Arahkan wajah ke dalam kotak');await sleep(120);continue}
  miss=0;const b=d.box,vw=v.videoWidth,vh=v.videoHeight,n=Math.min(vw,vh),dx=1-((b.x+b.width/2)-(vw-n)/2)/n,dy=((b.y+b.height/2)-(vh-n)/2)/n,sz=b.width/n;
  const m=sz<.32?'Dekatkan wajah':sz>.62?'Mundur sedikit':dx<.37?'Geser wajah ke kanan':dx>.63?'Geser wajah ke kiri':dy<.35?'Turunkan wajah sedikit':dy>.65?'Naikkan wajah sedikit':null;
  if(m){okN=0;guide(false,m);await sleep(120);continue}
  okN++;guide(true,'Pas! Tahan sebentar...');
  if(okN>=3){const r=await faceapi.detectSingleFace(v,o).withFaceLandmarks().withFaceDescriptor();if(r)return Array.from(r.descriptor);okN=0}
  await sleep(120)}
 guide(false,'Waktu habis, ketuk tombol lagi');return null}
const fdist=(a,b)=>Math.sqrt(a.reduce((q,x,i)=>q+(x-b[i])**2,0));
const geo=()=>new Promise((ok,no)=>{if(!navigator.geolocation)return no(new Error('Browser tidak mendukung GPS'));navigator.geolocation.getCurrentPosition(p=>ok(p.coords),e=>no(new Error(e.code===1?'Izin lokasi ditolak. Aktifkan lokasi untuk situs ini.':'Gagal membaca lokasi, coba di area terbuka')),{enableHighAccuracy:true,timeout:15000,maximumAge:0})});
const dist=(a,b,c,d)=>{const r=x=>x*Math.PI/180,h=Math.sin(r(c-a)/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(r(d-b)/2)**2;return 2*6371000*Math.asin(Math.sqrt(h))};
let AC=null;
function unlockAudio(){try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();if(AC.state==='suspended')AC.resume()}catch(_){}}
function beep(q){try{unlockAudio();let t=AC.currentTime;q.forEach(([f,d,y])=>{const o=AC.createOscillator(),g=AC.createGain();o.type=y||'sine';o.frequency.value=f;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.6,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+d);o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.03);t+=d})}catch(_){}}

 beep(SND[k]);setTimeout(()=>say(voice),k==='err'?500:700);try{navigator.vibrate&&navigator.vibrate(k==='err'?[200,100,200]:[150])}catch(_){}clearTimeout(ovl.k);ovl.k=setTimeout(()=>o.style.display='none',8000)}

brandPick(inp){const f=inp.files&&inp.files[0];if(!f)return;if(!/^image\//.test(f.type))return toast('File harus berupa gambar');const fr=new FileReader();fr.onload=()=>{const im=new Image();im.onload=()=>{const M=256,k=Math.min(1,M/Math.max(im.width,im.height)),w=Math.max(1,Math.round(im.width*k)),hh=Math.max(1,Math.round(im.height*k)),c=document.createElement('canvas');c.width=w;c.height=hh;const x=c.getContext('2d');x.drawImage(im,0,0,w,hh);let u=c.toDataURL('image/png');if(u.length>300000){x.globalCompositeOperation='destination-over';x.fillStyle='#fff';x.fillRect(0,0,w,hh);u=c.toDataURL('image/jpeg',.85)}if(u.length>300000)return toast('Gambar terlalu besar, pilih gambar lain');BRT=u;const p=$('br-p');if(p)p.innerHTML='<img alt="" src="'+u+'" style="width:100%;height:100%;object-fit:contain">'};im.onerror=()=>toast('Gambar tidak bisa dibaca');im.src=fr.result};fr.readAsDataURL(f)},
